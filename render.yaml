services:
  - type: web
    name: insurance-intelligence
    runtime: python
    buildCommand: "pip install -r requirements.txt && pip install -r requirements-api.txt && cd frontend && npm install && npm run build"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11"
